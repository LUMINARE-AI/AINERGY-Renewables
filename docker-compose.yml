services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: powerprocure
      POSTGRES_PASSWORD: powerprocure
      POSTGRES_DB: powerprocure
    ports:
      - "5432:5432"
    volumes:
      - powerprocure_pgdata:/var/lib/postgresql/data

volumes:
  powerprocure_pgdata:
